<main class="dashboard">
  <header class="dashboard-header">
    <div>
      <h1>Bonjour 👋</h1>
      <p class="subtitle">Voici votre résumé du jour</p>
    </div>
    <button class="btn-logout" (click)="logout()" title="Se déconnecter" aria-label="Se déconnecter">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </header>

  <section class="bento-grid">

    <div class="card card--tasks">
      <p class="widget-label">Tâches</p>
      <span class="widget-value">—</span>
      <p class="widget-sub">Bientôt disponible</p>
    </div>

    <div class="card card--messages">
      <p class="widget-label">Messages non lus</p>
      <span class="widget-value">—</span>
      <p class="widget-sub">Bientôt disponible</p>
    </div>

    <div class="card card--events">
      <p class="widget-label">Prochains événements</p>
      <span class="widget-value">—</span>
      <p class="widget-sub">Bientôt disponible</p>
    </div>

    <div class="card card--accent">
      <p class="quick-label">Naviguer</p>
      <nav class="quick-links">
        <a routerLink="/tasks">Tâches</a>
        <a routerLink="/calendar">Calendrier</a>
        <a routerLink="/chat">Messages</a>
      </nav>
    </div>

  </section>
</main>
